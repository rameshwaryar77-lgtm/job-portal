<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Career Developer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-login">
  <header class="site-header page-header">
    <a class="brand" href="index.html">Career Developer</a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="job.html">Jobs</a>
      <a href="contact.html">Contact</a>
      <a class="nav-button is-active" href="login.html">Login</a>
    </nav>
  </header>
  <main class="form-shell">
    <section class="form-card narrow-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Login to your account</h1>
      <form class="application-form" action="index.html">
        <label class="form-field"><span>Email</span><input type="email" placeholder="Enter your email" required /></label>
        <label class="form-field"><span>Password</span><input type="password" placeholder="Enter your password" required /></label>
        <div class="form-actions center-actions"><button class="button button-primary" type="submit">Login</button></div>
      </form>
    </section>
  </main>
</body>
</html>
